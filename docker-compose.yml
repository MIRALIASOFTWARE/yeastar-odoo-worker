# Para desplegar en Dokploy como servicio "Compose" desde este repositorio (Modo Swarm).
#
# Antes de desplegar:
#   1) Cambia api.tudominio.com por tu dominio en la etiqueta "rule".
#   2) Crea un registro DNS tipo A de ese dominio hacia la IP del servidor.
#   3) En la pestaña Environment de Dokploy define las variables (ver .env.example).
#
# Traefik (el de Dokploy) publica el servicio y emite el certificado HTTPS.
# Si tu Dokploy usa Cloudflare con la configuración por defecto, cambia
# entrypoints=websecure por entrypoints=web y elimina la línea de certResolver.

services:
  gateway:
    build: .
    restart: unless-stopped
    environment:
      BIND_ADDR: "0.0.0.0:8080"
      # Obligatorias: si faltan, el despliegue se detiene con un mensaje claro
      ODOO_URL: "${ODOO_URL:?Falta ODOO_URL en Environment}"
      ODOO_DB: "${ODOO_DB:?Falta ODOO_DB en Environment}"
      ODOO_API_KEY: "${ODOO_API_KEY:?Falta ODOO_API_KEY en Environment}"
      PBX_WEBHOOK_SECRET: "${PBX_WEBHOOK_SECRET:?Falta PBX_WEBHOOK_SECRET en Environment}"
      # Opcionales: vacías = el servicio usa su valor por defecto
      ODOO_UID: "${ODOO_UID:-}"
      BUSINESS_TZ: "${BUSINESS_TZ:-}"
      OWNER_PIN: "${OWNER_PIN:-}"
      OWNER_PARTNER_ID: "${OWNER_PARTNER_ID:-}"
      CAL_USER_ID: "${CAL_USER_ID:-}"
      CAL_PARTNER_IDS: "${CAL_PARTNER_IDS:-}"
      HELPDESK_TEAM_ID: "${HELPDESK_TEAM_ID:-}"
      HELPDESK_USER_ID: "${HELPDESK_USER_ID:-}"
      HELPDESK_STAGE_ID: "${HELPDESK_STAGE_ID:-}"
      RUST_LOG: "${RUST_LOG:-info}"
    expose:
      - "8080"
    networks:
      - dokploy-network
    # --- CONFIGURACIÓN AÑADIDA PARA MODO SWARM ---
    deploy:
      mode: replicated
      replicas: 2  # Puedes cambiar el número de instancias según requieras
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
    # ---------------------------------------------
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.yeastar-gw.rule=Host(`yeastar-worker.miraliasoftware.cu`)
      - traefik.http.routers.yeastar-gw.entrypoints=websecure
      - traefik.http.routers.yeastar-gw.tls.certResolver=letsencrypt
      - traefik.http.services.yeastar-gw.loadbalancer.server.port=8080
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dokploy-network:
    external: true
